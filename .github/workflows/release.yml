name: Release APK

# Publishing a release is what feeds the app's in-app updater: it reads this repository's
# releases/latest and offers whatever APK is attached there.
#
# Trigger either way:
#   git tag v1.3.1 && git push origin v1.3.1
#   or run this workflow manually and type the version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 1.3.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install the SDK pieces this project compiles against
        run: |
          set -euo pipefail
          # The runner already has cmdline-tools/latest, so installing a newer one lands in
          # latest-2 and the old sdkmanager stays on PATH — and it only understands SDK XML v3,
          # which is why it cannot see android-37. Fetch a known-good one to a scratch dir instead.
          CLT="$RUNNER_TEMP/cmdline-tools"
          mkdir -p "$CLT"
          curl -fsSL -o "$RUNNER_TEMP/clt.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$CLT"
          SDKM="$CLT/cmdline-tools/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-37" "build-tools;37.0.0"
          "$SDKM" --sdk_root="$ANDROID_HOME" --list_installed
      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${{ github.event.inputs.version }}"
          fi
          case "$NAME" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::version must look like 1.3.1, got '$NAME'"; exit 1 ;;
          esac
          # major*10000 + minor*100 + patch keeps versionCode monotonic and derivable.
          CODE=$(echo "$NAME" | awk -F. '{printf "%d", $1*10000 + $2*100 + $3}')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME (versionCode $CODE)"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Without the original signing key the"
            echo "::error::published APK cannot install over an existing DSH Mobile install."
            echo "::error::Add the repository secrets described in README.zh.md first."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/dsh-release.jks
          {
            echo "storeFile=keystore/dsh-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the signed APK
        env:
          DSH_DEFAULT_API_KEY: ${{ secrets.DEFAULT_API_KEY }}
        run: |
          ./gradlew --no-daemon \
            -PdshVersionName=${{ steps.version.outputs.name }} \
            -PdshVersionCode=${{ steps.version.outputs.code }} \
            testDebugUnitTest :app:collectRelease

      - name: Confirm it is signed with the expected key
        run: |
          set -euo pipefail
          APK="release/dsh-mobile-${{ steps.version.outputs.name }}.apk"
          ls -l "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="${{ steps.version.outputs.name }}"
          APK="release/dsh-mobile-$NAME.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')   # runner is Linux
          # Written to a file so no release note can break this workflow's YAML.
          {
            echo "DSH Mobile v$NAME"
            echo
            echo "安装包会被应用内的「检查更新」自动发现：设置 → 更新 → 检查更新。"
            echo "首次安装需要在系统里允许本应用安装未知来源应用。"
            echo
            echo "SHA-256:"
            echo '```'
            echo "$SHA"
            echo '```'
          } > release-notes.md
          gh release create "v$NAME" "$APK" --title "v$NAME" --notes-file release-notes.md --latest

      - name: Clean up the signing material
        if: always()
        run: rm -rf keystore keystore.properties
